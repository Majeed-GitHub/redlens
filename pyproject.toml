[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redlens"
version = "0.1.0"
description = "Zero-dependency prompt-injection, agent tool-poisoning and evasion scanner for LLM and agentic AI systems"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Shaik Majeed" }]
keywords = ["llm-security", "prompt-injection", "ai-red-teaming", "owasp-llm", "mcp", "agentic-ai"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
redlens = "redlens.cli:main"

[tool.setuptools]
packages = ["redlens"]

[tool.setuptools.package-data]
redlens = ["corpus/*.jsonl"]
